<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SlopGarden Setup</title>
<style>
  @font-face {
    font-family: "Source Sans 3 Variable";
    src: url("fonts/source-sans-3-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Source Serif 4 Variable";
    src: url("fonts/source-serif-4-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 900;
    font-display: swap;
  }
  :root {
    color-scheme: light;
    --ink: #14211b;
    --soft: #5e6a62;
    --paper: #f3ecdf;
    --card: #f7f1e6;
    --line: #d9d0c0;
    --dusk: #121a16;
    --accent: #d24a24;
  }
  body {
    margin: 0;
    min-height: 100vh;
    font: 16px/1.45 "Source Sans 3 Variable", "Source Sans 3", sans-serif;
    background: var(--dusk);
    color: var(--ink);
  }
  main {
    max-width: 440px;
    margin: 32px auto;
    background: var(--paper);
    border-radius: 16px;
    padding: 28px 24px;
  }
  h1 {
    margin: 0 0 4px;
    font-family: "Source Serif 4 Variable", Georgia, serif;
    font-weight: 560;
    font-size: 1.8rem;
    letter-spacing: -0.03em;
  }
  p.lead { color: var(--soft); margin: 0 0 16px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button, .choice {
    font: inherit;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 16px;
    text-align: left;
    cursor: pointer;
  }
  button:focus-visible, .choice:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  @media (max-width: 520px) {
    .choices { grid-template-columns: 1fr; }
    main { margin: 12px; padding: 20px; }
  }
  button.primary {
    background: var(--accent);
    color: #fffaf6;
    border: 0;
    width: 100%;
    margin-top: 12px;
    font-weight: 650;
  }
  button.primary:disabled { opacity: .6; }
  label { display: block; font-size: .85rem; margin: 12px 0 4px; font-weight: 650; }
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #faf6ef;
    color: var(--ink);
    font: inherit;
  }
  .error { background: #f8e0d6; color: #7a2612; padding: 10px 12px; border-radius: 8px; }
  .ok { background: #e3ebe4; padding: 10px 12px; border-radius: 8px; }
  pre { white-space: pre-wrap; background: var(--dusk); color: #e7efe8; padding: 10px; border-radius: 8px; font-size: .8rem; }
  #back { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>SlopGarden</h1>
  <p class="lead" id="lead">What is this machine?</p>
  <div id="app"></div>
</main>
<script src="renderer.js"></script>
</body>
</html>
