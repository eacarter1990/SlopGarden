<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SlopGarden Setup</title>
<style>
  @font-face {
    font-family: "Source Sans 3 Variable";
    src: url("fonts/source-sans-3-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Source Serif 4 Variable";
    src: url("fonts/source-serif-4-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 900;
    font-display: swap;
  }
  :root {
    color-scheme: light;
    --ink: #14211b;
    --soft: #5e6a62;
    --paper: #f3ecdf;
    --paper-2: #f7f1e6;
    --paper-3: #efe6d6;
    --line: #d9d0c0;
    --dusk: #121a16;
    --accent: #d24a24;
    --serif: "Source Serif 4 Variable", "Source Serif 4", Georgia, serif;
    --sans: "Source Sans 3 Variable", "Source Sans 3", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 16px/1.45 var(--sans);
    background: var(--dusk);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: min(640px, 100%);
    background: var(--paper);
    border-radius: 16px;
    padding: 28px 24px 24px;
  }
  header { margin-bottom: 8px; }
  .mark { display: block; margin-bottom: 10px; }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 560;
    font-size: 1.85rem;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  p.lead { color: var(--soft); margin: 6px 0 0; font-size: 15px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .choice {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 156px;
    text-align: left;
    background: #faf6ef;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    color: var(--ink);
  }
  .choice:hover { background: var(--paper-3); }
  .choice-kicker {
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--soft);
  }
  .choice-title {
    font-family: var(--serif);
    font-weight: 560;
    font-size: 1.45rem;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .choice-body { color: var(--soft); font-size: 14px; }
  .logbook { display: flex; flex-direction: column; margin-top: 6px; }
  .row {
    display: grid;
    grid-template-columns: minmax(9.5rem, 13rem) minmax(0, 1fr);
    column-gap: 18px;
    align-items: center;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
  }
  .row label {
    margin: 0;
    font-family: var(--serif);
    font-weight: 560;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .row input {
    width: 100%;
    min-height: 40px;
    padding: 8px 12px;
    border: 0;
    border-radius: 10px;
    background: #fffdf8;
    box-shadow: inset 0 0 0 1px var(--line);
    color: var(--ink);
    font: inherit;
  }
  .row input:focus {
    outline: none;
    box-shadow: inset 0 0 0 1px var(--ink), inset 0 -2px 0 var(--ink);
  }
  .note { color: var(--soft); font-size: 14px; margin: 14px 0 0; }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 14px;
  }
  button.primary {
    background: var(--accent);
    color: #fffaf6;
    border: 0;
    border-radius: 10px;
    padding: 9px 16px;
    font-weight: 650;
  }
  button.primary:hover { background: #b83a18; }
  button.primary:disabled { background: #e4d9c8; color: #8a8174; cursor: default; }
  button.quiet {
    background: transparent;
    border: 0;
    color: var(--soft);
    border-radius: 10px;
    padding: 9px 12px;
    font-weight: 650;
  }
  button.quiet:hover { color: var(--ink); background: var(--paper-3); }
  .error, .ok { margin-top: 12px; padding: 10px 12px; border-radius: 10px; }
  .error { background: #f8e0d6; color: #7a2612; }
  .ok { background: #e3ebe4; }
  pre {
    white-space: pre-wrap;
    background: var(--dusk);
    color: #e7efe8;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.8rem;
    margin: 8px 0 0;
  }
  @media (max-width: 560px) {
    body { align-items: flex-start; padding: 12px; }
    main { padding: 22px 16px 16px; }
    .choices { grid-template-columns: 1fr; }
    .choice { min-height: 0; }
    .row { grid-template-columns: 1fr; row-gap: 6px; padding: 12px 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="12" fill="#121a16"/>
      <path d="M32 46V28" stroke="#f3ecdf" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M32 34c7.5-.6 13-7 13.5-7.2-.8 8.4-7.2 14.2-13.5 12.4z" fill="#f3ecdf"/>
      <path d="M32 40c-6.2-.4-10.6-5.6-11-5.8.6 6.8 5.8 11.4 11 10z" fill="#d24a24"/>
    </svg>
    <h1>SlopGarden</h1>
    <p class="lead" id="lead">What is this machine?</p>
  </header>
  <div id="app"></div>
</main>
<script src="renderer.js"></script>
</body>
</html>
