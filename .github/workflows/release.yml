name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "version=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/slopgarden-server:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/slopgarden-server:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/slopgarden-client:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/slopgarden-client:latest
  server-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish the server
        run: dotnet publish src/SlopGarden.Server/SlopGarden.Server.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish -p:DebugType=none -p:DebugSymbols=false
      - name: Pack one shell installer
        run: |
          version="0.2.${GITHUB_RUN_NUMBER}"
          scripts/pack-server-linux.sh publish "SlopGardenServer-${version}-${{ matrix.rid }}.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: SlopGardenServer-*.sh
          if-no-files-found: error

  server-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish the server
        run: dotnet publish src/SlopGarden.Server/SlopGarden.Server.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish -p:DebugType=none -p:DebugSymbols=false
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
      - name: Pack one MSI
        shell: bash
        run: |
          version="0.2.${GITHUB_RUN_NUMBER}"
          scripts/pack-server-msi.sh publish "SlopGardenServer-${version}-${{ matrix.rid }}.msi" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: SlopGardenServer-*.msi
          if-no-files-found: error

  server-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish the server
        run: dotnet publish src/SlopGarden.Server/SlopGarden.Server.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish -p:DebugType=none -p:DebugSymbols=false
      - name: Pack one DMG
        run: |
          version="0.2.${GITHUB_RUN_NUMBER}"
          scripts/pack-server-dmg.sh publish "SlopGardenServer-${version}-${{ matrix.rid }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: SlopGardenServer-*.dmg
          if-no-files-found: error

  release:
    needs: [publish, server-linux, server-windows, server-macos]
    runs-on: ubuntu-latest
    steps:
      # gh release create shells out to git for the repo and the commit to tag.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: setup-dist
          merge-multiple: true
      - name: Cut a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="0.2.${GITHUB_RUN_NUMBER}"
          notes=$(cat <<EOF
          Server and client images for linux/amd64 and linux/arm64 are on GHCR as \`${version}\` and \`latest\`.

          The server installer is one file. Linux is a shell script (`sudo ./SlopGardenServer-*-linux-*.sh`). Windows is an MSI that installs the SlopGardenServer service and starts it automatically. macOS is a DMG; open it and run Install SlopGarden Server. The macOS build is not notarized. Uninstalling removes that service. Docker Compose is unchanged.
          EOF
          )
          shopt -s nullglob
          files=(setup-dist/*.sh setup-dist/*.msi setup-dist/*.dmg)
          if (( ${#files[@]} == 0 )); then
            echo "No server installers in setup-dist." >&2
            exit 1
          fi
          gh release create "v${version}" "${files[@]}" \
            --title "SlopGarden ${version}" \
            --notes "${notes}"
