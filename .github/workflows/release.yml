name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "version=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/slopgarden-server:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/slopgarden-server:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/slopgarden-client:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/slopgarden-client:latest
  setup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            flags: --linux --x64
          - rid: linux-arm64
            flags: --linux --arm64
          - rid: win-x64
            flags: --win --x64
          - rid: win-arm64
            flags: --win --arm64
          - rid: osx-x64
            flags: --mac --x64
          - rid: osx-arm64
            flags: --mac --arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish the setup helper
        run: dotnet publish tools/SlopGarden.Setup/SlopGarden.Setup.csproj -c Release -r ${{ matrix.rid }} -o setup-app/helper -p:DebugType=none -p:DebugSymbols=false
      - name: Package the desktop app
        working-directory: setup-app
        run: |
          npm ci
          npx electron-builder ${{ matrix.flags }} --publish never -c.extraMetadata.version=0.2.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.rid }}
          path: setup-app/dist/*
          if-no-files-found: error

  release:
    needs: [publish, setup]
    runs-on: ubuntu-latest
    steps:
      # gh release create shells out to git for the repo and the commit to tag.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: setup-dist
          merge-multiple: true
      - name: Cut a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="0.2.${GITHUB_RUN_NUMBER}"
          notes=$(cat <<EOF
          Server and client images for linux/amd64 and linux/arm64 are on GHCR as \`${version}\` and \`latest\`.

          SlopGarden Setup is the desktop app in the files below (Windows x64 and ARM, macOS Intel and Apple silicon, Linux x64 and ARM64). The macOS builds are not notarized: right-click the app and choose Open the first time.
          EOF
          )
          gh release create "v${version}" setup-dist/* \
            --title "SlopGarden ${version}" \
            --notes "${notes}"
